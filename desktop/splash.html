<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
    <title>SinyalAbidnet Kliper Pro</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #1a2130 0%, #0b0e14 70%);
        color: #e8ecf4;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      .logo {
        font-size: 2.6rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(90deg, #ff5e3a, #ffb03a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        color: #8b97ad;
        font-size: 0.95rem;
      }
      .spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #ff5e3a;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">🎬 SinyalAbidnet Kliper Pro</div>
      <div class="spinner"></div>
      <div class="sub">Starting the video engine, please wait…</div>
    </div>
  </body>
</html>
